name: Build hyalineOS APKs & Publish Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app-launcher/**'
      - 'app-phone/**'
      - 'app-messages/**'
      - 'core-theme/**'
      - 'core-privilege/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build hyalineOS Suite APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hyalineOS
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses & install API 36.1 + build-tools 36.0.0
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build Debug APKs (Launcher, Phone, Messages)
        run: |
          ./gradlew :app-launcher:assembleDebug :app-phone:assembleDebug :app-messages:assembleDebug --no-daemon

      - name: Collect APKs, bundle pre-included PulseMesh APK & generate SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-apks
          cp app-launcher/build/outputs/apk/debug/app-launcher-debug.apk dist-apks/hyalineOS-launcher-debug.apk
          cp app-phone/build/outputs/apk/debug/app-phone-debug.apk dist-apks/hyalinePhone-debug.apk
          cp app-messages/build/outputs/apk/debug/app-messages-debug.apk dist-apks/hyalineMessages-debug.apk
          gh release download -R Kostadinosk/PulseMesh --pattern "*.apk" -D dist-apks || true
          (cd dist-apks && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist-apks

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyalineOS-apks
          path: dist-apks/*

      - name: Publish / update Release with full APK suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.2.0"
          cat <<'EOF' > release-notes.md
          ## hyalineOS v0.2.0 — Full Functional Dual-OS Launcher, Phone, Messages & Pre-Included PulseMesh

          ### Included APKs
          - **`hyalineOS-launcher-debug.apk` (`os.hyaline.launcher`)** — Full daily-driver Android Home Launcher:
            - Discovers **all installed Android apps** with real vector/adaptive app icons & live install/uninstall tracking
            - **OS 1 Surface Lite**: 4 Metro × Frutiger Aero styles, resizable `1×1` / `2×2` / `4×2` Live Tiles (long-press any tile to resize, tint, reorder, or unpin), swipe-down notification shade, Android System Wallpaper passthrough, and persistent layout/OOBE storage
            - **Classic WP8 Swipe-Left A–Z App Drawer**: Instant search, alphabetical section headers, 4×7 Fast-Jump Letter Grid, Pin to Start, App Info, and Uninstall
            - **7 Working Built-In Apps**: `hyaline Notes`, `Clock & Stopwatch & Focus Timer`, `Calculator & Converter`, `System & Battery Pulse`, `Dual-Mode File Explorer`, `Quick Tools & Flashlight`, and `OS Studio` (Default Launcher role, Live Tile notification listener, JSON import/export)
            - **OS 2 Deep OS** (strictly gated on Shizuku or Root): PIN + Biometric Smart Lock, Decoy Guest PIN, real Shizuku/Root **App Freezer**, **Freeform Floating Windows**, **Interactive Shell Terminal**, and **Private Vault Pad**
          - **`hyalinePhone-debug.apk` (`os.hyaline.phone`)** — Full standalone `ROLE_DIALER` Telco app with `TelecomManager` calling, Call Log, Contacts search, and `InCallService` + Aero In-Call UI (Answer, Decline, Mute, Speaker, Hold, DTMF Keypad)
          - **`hyalineMessages-debug.apk` (`os.hyaline.messages`)** — Full standalone `ROLE_SMS` app with `Telephony.Sms` conversation threads, multipart `SmsManager` sending, `SmsDeliverReceiver` inbox persistence + notifications + Live Tile updates, and 1-tap OTP copy
          - **Pre-included `PulseMesh` (`com.KostadinosK.pulsemesh`)** — Bundled directly alongside the hyalineOS APKs
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-apks/* --clobber
            gh release edit "$TAG" --title "hyalineOS v0.2.0 (Full Functional Suite APKs)" --notes-file release-notes.md
          else
            gh release create "$TAG" dist-apks/* \
              --title "hyalineOS v0.2.0 (Full Functional Suite APKs)" \
              --notes-file release-notes.md
          fi
